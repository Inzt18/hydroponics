; VS Code + PlatformIO — ESP32 fertigation controller
; Open this folder in VS Code, then click Upload (→) in PlatformIO toolbar.

[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter =
  +<*>
  -<*.md>
upload_speed = 921600
lib_ldf_mode = chain
build_flags =
  -DCORE_DEBUG_LEVEL=0
