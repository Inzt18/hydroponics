; VS Code + PlatformIO — ESP32-CAM (AI Thinker)
; Open this folder in VS Code, then click Upload (→) in PlatformIO toolbar.
; For first flash: connect GPIO0 to GND, then upload, then remove jumper + reset.

[platformio]
src_dir = .
default_envs = esp32cam

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_src_filter =
  +<*>
  -<*.md>
upload_speed = 115200
lib_ldf_mode = chain
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
